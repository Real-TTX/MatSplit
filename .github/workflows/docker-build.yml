name: docker-build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # -------------------------------------------------------------------------
  # Compile check - runs for every push and pull request.
  # -------------------------------------------------------------------------
  build-test:
    name: build-test (dotnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve build target
        id: target
        shell: bash
        run: |
          if [ -f MatSplit.sln ]; then
            echo "path=MatSplit.sln" >> "$GITHUB_OUTPUT"
          else
            echo "path=src/MatSplit.Web/MatSplit.Web.csproj" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore "${{ steps.target.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.target.outputs.path }}" --configuration Release --no-restore

      - name: Publish (smoke test)
        run: |
          dotnet publish src/MatSplit.Web/MatSplit.Web.csproj \
            --configuration Release \
            --no-restore \
            --output "${RUNNER_TEMP}/publish"

  # -------------------------------------------------------------------------
  # Container image - only on push (main/dev) and manual runs.
  # -------------------------------------------------------------------------
  docker:
    name: image (buildx)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          read_prop() {
            if [ -f Directory.Build.props ]; then
              sed -n "s:.*<$1>\([^<]*\)</$1>.*:\1:p" Directory.Build.props | head -n 1
            fi
          }

          major="$(read_prop VersionMajor)"
          minor="$(read_prop VersionMinor)"
          [ -n "$major" ] || major="0"
          [ -n "$minor" ] || minor="1"

          stamp="$(date -u +%Y%m%d)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          branch="${GITHUB_REF_NAME}"
          slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed 's/--*/-/g; s/^-//; s/-$//')"
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # build-push-action accepts a comma separated tag list
          if [ "$branch" = "main" ]; then
            version="${major}.${minor}.${GITHUB_RUN_NUMBER}-${stamp}"
            tags="${image}:${version},${image}:latest"
          elif [ "$branch" = "dev" ]; then
            version="nightly-${GITHUB_RUN_NUMBER}-${stamp}"
            tags="${image}:${version}"
          else
            version="${slug}-${GITHUB_RUN_NUMBER}-${stamp}"
            tags="${image}:${version}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

          printf '### Image\n\n- version: `%s`\n- tags: `%s`\n' "$version" "$tags" >> "$GITHUB_STEP_SUMMARY"

      # GHCR push is optional: forks without credentials still get a full
      # build, they just skip the registry login and the push.
      - name: Check registry credentials
        id: registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "${GHCR_TOKEN}" ]; then
            echo "mode=secret" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository_owner }}" = "Real-TTX" ]; then
            echo "mode=github-token" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "No GHCR credentials available - building without push." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (repository secret)
        if: steps.registry.outputs.mode == 'secret'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to GHCR (GITHUB_TOKEN)
        if: steps.registry.outputs.mode == 'github-token'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.registry.outputs.push == 'true' }}
          load: ${{ steps.registry.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_CONFIGURATION=Release
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
