<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64" role="img" aria-labelledby="ms-logo-title">
    <title id="ms-logo-title">MatSplit</title>
    <defs>
        <linearGradient id="msLogoWarm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc266" />
            <stop offset="1" stop-color="#ffa233" />
        </linearGradient>
        <linearGradient id="msLogoDeep" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7862a" />
            <stop offset="1" stop-color="#e4570a" />
        </linearGradient>
        <style>
            .ms-logo-word { fill: #2c1c12; }
            .ms-logo-accent { fill: #ef6c14; }
            @media (prefers-color-scheme: dark) {
                .ms-logo-word { fill: #f8ede2; }
                .ms-logo-accent { fill: #ff8a3c; }
            }
        </style>
    </defs>
    <g stroke="#ffb03a" stroke-width="3.2" stroke-linecap="round">
