    <path d="M29 15A17 17 0 0 0 29 49Z" fill="url(#msLogoWarm)" />
    <path d="M35 15A17 17 0 0 1 35 49Z" fill="url(#msLogoDeep)" />
    <text x="70" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="30" font-weight="700" letter-spacing="-0.6">
        <tspan class="ms-logo-word">Mat</tspan><tspan class="ms-logo-accent">Split</tspan>
