# ---------------------------------------------------------------------------
# MatSplit - Release / Selfhost Stack
#   Start:  docker compose up -d
#   App:    http://localhost:4774
# ---------------------------------------------------------------------------
name: matsplit

services:
  msbi:
    image: ghcr.io/real-ttx/matsplit:latest
    # Fallback: builds locally when the image cannot be pulled
    # (or explicitly via "docker compose up -d --build").
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        APP_VERSION: ${MATSPLIT_VERSION:-local}
    container_name: matsplit
    restart: unless-stopped
    ports:
      - "4774:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MATSPLIT_DATA_DIR: /data
      TZ: ${TZ:-Europe/Berlin}
      # Mat platform (optional, see README "Platform API" / "Sign-in with MatIdentity"):
      # MAT_API_KEY: change-me                          # X-Api-Key for /api/state, /api/configure, /api/actions
      # MATIDENTITY_AUTHORITY: https://id.example.com   # set = sign-in through MatIdentity
      # MATIDENTITY_CLIENT_ID: matsplit
      # MATIDENTITY_CLIENT_SECRET: change-me
      # MATIDENTITY_INTERNAL_URL: http://matidentity:2300  # only when MatSplit reaches MatIdentity at another address
    volumes:
      # /data/db, /data/config, /data/receipts, /data/keys, /data/logs
      - matsplit-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  matsplit-data:
    name: matsplit-data
